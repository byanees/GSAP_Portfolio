# Submits changed pages to IndexNow once a Vercel production deploy is live.
# Vercel reports each deploy to GitHub as a deployment; this runs when one to
# the Production environment succeeds. See scripts/indexnow.mjs.

name: IndexNow

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      all:
        description: Submit every page, not only the ones that changed
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: indexnow
  cancel-in-progress: false

jobs:
  submit:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
       github.event.deployment.environment == 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # The fingerprints saved by the last successful run. Cache entries are
      # immutable, so each run saves under its own key and the prefix restores
      # the newest.
      - uses: actions/cache/restore@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
          restore-keys: indexnow-

      - name: Submit changed pages
        run: node scripts/indexnow.mjs ${{ inputs.all && '--all' || '' }}
        env:
          # Manual runs submit whatever is live, so they skip the commit check.
          EXPECTED_SHA: ${{ github.event.deployment.sha }}

      - uses: actions/cache/save@v4
        with:
          path: .indexnow
          key: indexnow-${{ github.run_id }}
